version: 2

models:
  - name: stg_customers
    description: "Cleaned customers, one row per customer."
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: tier
        description: "{{ doc('customer_tier') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: ['gold', 'silver', 'bronze']

  - name: stg_products
    description: "Cleaned products, one row per product."
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: stg_orders
    description: "Cleaned orders, one row per order."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: discount
        description: "Discount as a fraction, 0.10 = 10%."
        data_tests:
          - is_between_zero_and_one
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['online', 'store', 'partner']