version: 2

sources:
  - name: raw
    description: "Raw tables as loaded from the operational system."
    schema: raw
    tables:
      - name: raw_customers
        description: "One row per customer."
        columns:
          - name: customer_id
            data_tests:
              - unique
              - not_null

      - name: raw_products
        description: "One row per product."
        columns:
          - name: product_id
            data_tests:
              - unique
              - not_null

      - name: raw_orders
        description: "One row per order."
        columns:
          - name: order_id
            data_tests:
              - unique
              - not_null